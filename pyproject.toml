[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenbro-mcp"
version = "0.1.0"
description = "Portable Browser Driver with OCR, Artifact Logging, JSON-stdin CLI, and MCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48.0",
    "pillow>=10.4.0",
    "pytesseract>=0.3.13",
    "rapidocr-onnxruntime>=1.3.24",
    "pydantic>=2.9.0",
    "mcp>=1.2.0",
    "beautifulsoup4>=4.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
agenbro-cli = "driver.cli:main"
agenbro-mcp = "driver.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/driver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
